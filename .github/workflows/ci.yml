name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Release plan tests
        run: .github/scripts/release-plan.test.sh
      - name: Build
        run: dotnet build Jellyfin.Plugin.OidcLogin.slnx -c Release
      - name: Unit tests
        run: dotnet test --project tests/Jellyfin.Plugin.OidcLogin.Tests -c Release --no-build
      - name: Publish plugin
        run: dotnet publish src/Jellyfin.Plugin.OidcLogin -c Release -o artifacts/publish
      - name: Check no host assemblies are bundled
        # Jellyfin provides these; bundling them breaks the plugin at load time.
        run: |
          if ls artifacts/publish | grep -E '^(Microsoft\.Extensions\..*|System\.Text\.Json)\.dll$'; then
            echo "::error::Plugin output bundles assemblies Jellyfin already provides"
            exit 1
          fi
      - name: Check build.yaml lists every bundled assembly
        # jprm zips only the listed artifacts; a missing dependency breaks the plugin at runtime.
        run: |
          diff <(ls artifacts/publish | grep -E '\.dll$' | sort) \
               <(sed -n 's/^- "\(.*\.dll\)"$/\1/p' build.yaml | sort) \
            || { echo "::error::build.yaml artifacts differ from the published assemblies"; exit 1; }

  e2e:
    runs-on: ubuntu-26.04
    env:
      E2E_ARTIFACTS_DIR: ${{ github.workspace }}/e2e-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build tests/Jellyfin.Plugin.OidcLogin.E2ETests -c Release
      - name: Install Playwright Chromium
        run: pwsh tests/Jellyfin.Plugin.OidcLogin.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: End-to-end tests
        run: dotnet test --project tests/Jellyfin.Plugin.OidcLogin.E2ETests -c Release --no-build
      - name: Upload Playwright traces and container logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-artifacts
          path: ${{ env.E2E_ARTIFACTS_DIR }}
          if-no-files-found: ignore
